<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>◤ NEON.IMG ◢ // 图床服务</title>

  <!-- Google Fonts: preconnect 优化 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2300F0FF'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- 全屏视频背景 -->
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="/video/Cyberpunk.mp4" type="video/mp4">
  </video>

  <!-- 全屏扫描线覆盖层 -->
  <div class="scanlines"></div>

  <!-- 滚动扫描光带 -->
  <div class="scan-beam"></div>

  <!-- ==================== HUD 顶栏 ==================== -->
  <header class="hud">
    <div class="hud-left">
      <span class="logo glitch" data-text="◤ NEON.IMG ◢">◤ NEON.IMG ◢</span>
      <span class="version">// v1.4</span>
    </div>
    <div class="hud-right">
      <span class="status"><i class="dot"></i> ONLINE</span>
      <span class="counter">⌬ <b id="count">0</b> IMG</span>
      <a id="trashBtn" href="#trash" class="hud-btn" title="回收站">⊘ <span id="trashCount"></span></a>
      <a href="/api-docs" target="_blank" class="hud-btn" title="API 文档">API</a>
    </div>
  </header>

  <main>

    <!-- ==================== 上传区 ==================== -->
    <section id="dropzone" class="uplink">
      <span class="corner tl" aria-hidden="true"></span>
      <span class="corner tr" aria-hidden="true"></span>
      <span class="corner bl" aria-hidden="true"></span>
      <span class="corner br" aria-hidden="true"></span>

      <h2 class="uplink-title">&gt;&gt; 数据上传终端</h2>

      <div class="uplink-icon" aria-hidden="true">▼</div>

      <p class="uplink-main">&gt; 拖拽文件到此处<span class="caret">_</span></p>
      <p class="uplink-sub">// 粘贴 // 点击 // 拖拽 &nbsp;·&nbsp; 单文件最大 20MB</p>

      <input type="file" id="fileInput" multiple accept="image/*" hidden>
    </section>

    <!-- ==================== 画廊 ==================== -->
    <h3 class="section-title">// 图片库 · 共 <span id="count2">0</span> 条记录</h3>

    <!-- 搜索 / 排序 / 格式筛选 -->
    <div class="gallery-controls">
      <button id="batchToggleBtn" class="batch-toggle-btn">☑ 批量选择</button>
      <div class="search-wrap">
        <span class="search-prefix">//</span>
        <input id="searchInput" type="text"
               class="search-input"
               placeholder="搜索文件名..."
               autocomplete="off" spellcheck="false" />
      </div>
      <div class="sort-wrap">
        <span class="ctrl-label">排序</span>
        <select id="sortSelect" class="ctrl-select">
          <option value="time-desc">时间 ↓</option>
          <option value="time-asc">时间 ↑</option>
          <option value="size-desc">大小 ↓</option>
          <option value="size-asc">大小 ↑</option>
          <option value="name-asc">名称 A→Z</option>
          <option value="name-desc">名称 Z→A</option>
        </select>
      </div>
      <div class="filter-wrap">
        <span class="ctrl-label">格式</span>
        <div class="filter-tags" id="filterTags">
          <button class="filter-tag active" data-ext="all">全部</button>
          <button class="filter-tag" data-ext="png">PNG</button>
          <button class="filter-tag" data-ext="jpg">JPG</button>
          <button class="filter-tag" data-ext="gif">GIF</button>
          <button class="filter-tag" data-ext="webp">WEBP</button>
          <button class="filter-tag" data-ext="svg">SVG</button>
        </div>
      </div>
      <div class="tag-filter-wrap hidden" id="tagFilterWrap">
        <span class="ctrl-label">标签</span>
        <div class="tag-filter-list" id="tagFilterList"></div>
      </div>
    </div>

    <section id="gallery" class="gallery" aria-label="图片画廊"></section>

    <p id="empty" class="empty">暂无数据</p>

  </main>

  <footer>
    © 2026 NEON.IMG // Powered by Night City
  </footer>

  <!-- ==================== Toast 容器 ==================== -->
  <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

  <!-- ==================== 模态框（删除确认） ==================== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-header" id="modalTitle">! 确认删除</div>
      <div class="modal-body">即将永久销毁该数据包，确认继续？</div>
      <div class="modal-footer">
        <button id="modalCancel" class="btn">[ 取消 ]</button>
        <button id="modalOk" class="btn btn-danger">[ 确认 ]</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
